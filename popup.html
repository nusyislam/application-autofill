<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{font:13px/1.4 system-ui,sans-serif;width:260px;margin:0;padding:14px;color:#111827}
  h1{font-size:14px;margin:0 0 10px}
  button{width:100%;padding:10px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:600;cursor:pointer}
  button:hover{background:#1f2937}
  label{display:flex;gap:8px;align-items:center;margin:10px 0 0}
  #status{margin-top:10px;color:#374151;min-height:18px}
  a{display:block;margin-top:12px;color:#2563eb;cursor:pointer}
  .legend{margin-top:10px;font-size:12px;color:#6b7280}
  #build{margin-top:12px;font-size:11px;color:#9ca3af}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
  <h1>Application Autofill</h1>
  <button id="fill">Fill this page</button>
  <div id="shortcut" class="legend"></div>
  <label><input type="checkbox" id="useAI"> Use Claude for unknown questions</label>
  <label><input type="checkbox" id="learn"> Learn from my answers</label>
  <label><input type="checkbox" id="drafts"> Draft open-ended answers (blue, review before submitting)</label>
  <div id="status"></div>
  <div class="legend">
    <div><span class="dot" style="background:#3b82f6"></span>auto-answered, double-check</div>
    <div><span class="dot" style="background:#f59e0b"></span>needs you</div>
  </div>
  <a id="opts">Edit profile &amp; answers</a>
  <div id="build"></div>
  <script src="popup.js"></script>
</body>
</html>
