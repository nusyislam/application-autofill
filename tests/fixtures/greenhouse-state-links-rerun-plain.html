<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Software Engineer at Vantora (plain country name)</title>
<style>
  body { font: 14px sans-serif; }
  .field-wrapper { margin: 10px 0; }
  .select__control { border: 1px solid #999; min-height: 30px; width: 320px; position: relative; display: flex; flex-wrap: wrap; }
  .select__menu { position: absolute; background: #fff; border: 1px solid #999; width: 320px; z-index: 5; }
  .select__option { padding: 4px; }
</style>
<script>
// ---- stub chrome API (test only)
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: {
    source: "LinkedIn | Social Media | Job Board", hearText: "LinkedIn",
    firstName: "Test", lastName: "Applicant", email: "test@example.com", phone: "6465550100", phoneCountry: "United States",
    linkedin: "https://www.linkedin.com/in/test/", github: "https://github.com/test", website: "",
    country: "United States", city: "Springfield", state: "New York", zip: "10001", address1: "1 Test Street",
    expectedGraduation: "05/2027",
    experiences: [{ title: "Engineering Intern", company: "Examplecorp", current: false, startYear: "2026", endYear: "2026" }],
    education: [{ school: "Lakeview University", schoolAliases: "LSU Lakeview University", schoolSearch: "Lakeview", field: "Computer Engineering", endYear: "2027" }],
    answers: { workAuth: "Yes", sponsorship: "No", restrictions: "None", citizen: "Yes" },
    eeo: {}, api: { key: "test-key", model: "stub" },
  },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with.
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension",
    onMessage: { addListener: (fn) => (onMsg = fn) },
    sendMessage: async (msg) => {
      // The classifier as on the real page: residence questions "residence", the rest "other".
      if (msg.type === "CLASSIFY_ASK") {
        window.__classify = (window.__classify || []).concat(msg.questions.map((q) => q.question));
        return { model: "stub-haiku", categories: msg.questions.map((q) => ({ id: q.id, category: /reside|live in|residence/i.test(q.question) ? "residence" : "other" })) };
      }
      if (msg.type === "ASK_AI") {
        window.__aiPayload = (window.__aiPayload || []).concat(msg.questions.map((q) => q.question));
        return { model: "stub-model", answers: msg.questions.map((q) => ({ id: q.id, answer: null, confidence: 0.9 })) };
      }
      return {};
    },
  },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<h1>Software Engineer</h1>
<div class="job__location">New York, NY</div>
<!-- The same page with the profile country / phone country saved as a plain "United States" (the real profile may hold that form).
<!-- Vantora-like Greenhouse page (fake data), filled twice. Reported: "Which U.S. State or Canadian Province do you reside
     in?" (dropdown) was "classified residence: left for you"; "Portfolio" got the GitHub link while GitHub has its own
     field; the phone "Country" ("United States +1", shown as "+1" once picked, filled by the address-country rule) was re-filled on every rerun instead of kept. Controls: a state list
     of abbreviations, "New York (NY)" options, a country list, a city list, a yes / no residence question, a required
     "Personal website" (no unused link: yellow) and a phone-code dropdown that shows only the code. -->
<form id="application-form" class="application--form">
  <div class="field-wrapper phone-input">
    <div class="react-select" data-display="code" data-opts="Canada +1|India +91|United Kingdom +44|United States +1"><label id="country-label" for="country">Country<span>*</span></label></div>
    <div><label for="phone" id="phone-label">Phone<span>*</span></label><input id="phone" type="tel" aria-required="true"></div>
  </div>
  <div class="field-wrapper"><div class="react-select" data-display="code" data-opts="Canada +1|India +91|United Kingdom +44|United States +1"><label id="q_pcc-label" for="q_pcc">Phone country code</label></div></div>
  <div class="field-wrapper"><label id="q_li-label" for="q_li">LinkedIn Profile</label><input id="q_li" name="q_li" type="text"></div>
  <div class="field-wrapper"><label id="q_gh-label" for="q_gh">GitHub URL</label><input id="q_gh" name="q_gh" type="text"></div>
  <div class="field-wrapper"><label id="q_pf-label" for="q_pf">Portfolio</label><input id="q_pf" name="q_pf" type="text"></div>
  <div class="field-wrapper"><label id="q_web-label" for="q_web">Personal website*</label><input id="q_web" name="q_web" type="text" aria-required="true"></div>
  <div class="field-wrapper"><div class="react-select" data-opts="Alabama|Alaska|California|New Jersey|New York|Ohio|Texas|Alberta|British Columbia|Ontario|Quebec"><label id="q_st-label" for="q_st">Which U.S. State or Canadian Province do you reside in?*</label></div></div>
  <div class="field-wrapper"><div class="react-select" data-opts="CA|NJ|NY|TX|Other"><label id="q_st2-label" for="q_st2">Which state do you live in?*</label></div></div>
  <div class="field-wrapper"><div class="react-select" data-opts="California (CA)|New Jersey (NJ)|New York (NY)|Texas (TX)"><label id="q_st3-label" for="q_st3">State of residence*</label></div></div>
  <div class="field-wrapper"><div class="react-select" data-opts="Canada|India|United Kingdom|United States"><label id="q_co-label" for="q_co">Which country do you currently reside in?*</label></div></div>
  <div class="field-wrapper"><div class="react-select" data-opts="Boston|New York|Springfield|Other"><label id="q_ci-label" for="q_ci">Which city do you reside in?*</label></div></div>
  <div class="field-wrapper"><div class="react-select" data-opts="Yes|No"><label id="q_res-label" for="q_res">Do you currently reside in New York?*</label></div></div>
  <button type="submit" id="submit" onclick="event.preventDefault()">Submit Application</button>
</form>
<pre id="out"></pre>
<script>
// ---- react-select look-alike (test only): a control mousedown opens the menu once the input has seen focus events;
// typing filters it; clicking an option sets the single value (data-display="code": only the code, as Greenhouse's
// phone Country shows "+1" for "United States +1"); Escape closes.
let rs = 0;
function makeSelect(wrap) {
  const label = wrap.querySelector("label");
  const id = label.getAttribute("for");
  const all = wrap.dataset.opts.split("|");
  const lbId = "react-select-" + ++rs + "-listbox";
  wrap.insertAdjacentHTML("beforeend",
    `<div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div>` +
    `<div class="select__input-container"><input class="select__input" role="combobox" aria-expanded="false" aria-haspopup="true" aria-autocomplete="list" id="${id}" aria-labelledby="${id}-label" type="text"></div></div></div></div>`);
  const control = wrap.querySelector(".select__control");
  const vc = wrap.querySelector(".select__value-container");
  const input = wrap.querySelector("input");
  let menu = null;
  const close = () => { menu?.remove(); menu = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  const render = (list) => {
    if (!menu) {
      menu = document.createElement("div"); menu.className = "select__menu";
      control.after(menu);
      input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", lbId);
    }
    menu.innerHTML = `<div class="select__menu-list" role="listbox" id="${lbId}"></div>`;
    const lb = menu.firstChild;
    if (!list.length) lb.innerHTML = `<div class="select__menu-notice">No options</div>`;
    for (const t of list) {
      const o = document.createElement("div"); o.className = "select__option"; o.setAttribute("role", "option"); o.textContent = t;
      o.addEventListener("click", () => {
        window.__picks.push(id + ":" + t);
        vc.querySelector(".select__placeholder, .select__single-value")?.remove();
        vc.insertAdjacentHTML("afterbegin", `<div class="select__single-value">${wrap.dataset.display === "code" ? t.split(" ").pop() : t}</div>`);
        input.value = ""; close();
      });
      lb.appendChild(o);
    }
  };
  const filtered = () => all.filter((t) => !input.value || t.toLowerCase().includes(input.value.toLowerCase()));
  let focused = false;
  input.addEventListener("focusin", () => (focused = true));
  input.addEventListener("focusout", () => { focused = false; close(); });
  control.addEventListener("mousedown", () => { if (!focused) return; menu ? close() : render(filtered()); });
  input.addEventListener("input", () => render(filtered()));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.key === "ArrowDown" && !menu) render(filtered());
  });
}
window.__picks = [];
document.querySelectorAll(".react-select").forEach(makeSelect);
</script>
<!--SCRIPTS-->
<script>
const val = (w) => {
  const sv = w.querySelector(".select__single-value"); if (sv) return sv.textContent;
  const c = w.querySelector("textarea, input:not([role=combobox])"); return c ? c.value : "";
};
const report = (tag) => [...document.querySelectorAll(".field-wrapper")].map((w) => {
  const lab = (w.querySelector("label")?.textContent || "").replace(/\*/g, "").trim();
  const marked = w.closest("[data-wdaf]") || w.querySelector("[data-wdaf]");
  return tag + lab.slice(0, 50) + " = " + JSON.stringify(val(w)) + " mark=" + ((marked && marked.dataset.wdaf) || "-");
});
setTimeout(async () => {
  let stats, stats2;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const first = report("");
  const logs1 = window.__logs.splice(0);
  const picks1 = window.__picks.splice(0);
  await new Promise((r) => setTimeout(r, 1500));
  try { stats2 = await window.__runFill(); } catch (e) { window.__errors.push("run 2: " + e.stack); }
  const second = report("rerun: ");
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "CLASSIFY " + JSON.stringify(window.__classify || []),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    "PICKS " + JSON.stringify(picks1),
    "STATS2 " + JSON.stringify(stats2),
    "PICKS2 " + JSON.stringify(window.__picks),
    ...window.__errors.map((e) => "ERR " + e),
    ...logs1.map((l) => "LOG " + l),
    ...window.__logs.map((l) => "LOG rerun: " + l),
    ...first.map((f) => "FIELD " + f),
    ...second.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
