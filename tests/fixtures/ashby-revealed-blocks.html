<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Software Engineer, EUR @ Melodex</title>
<style>
  body { font: 14px sans-serif; }
  .ashby-application-form-field-entry { margin: 10px 0; position: relative; }
  .ashby-application-form-input-yesno { display: flex; gap: 4px; position: relative; }
  .ashby-application-form-input-yesno-option[aria-pressed="true"] { background: #333; color: #fff; }
  /* Real Ashby: the mirror checkbox is NOT hidden (it has client rects). */
  ._input_1svni_78 { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .combo-list { position: absolute; background: #fff; border: 1px solid #999; width: 320px; z-index: 5; }
  .combo-list [role=option] { padding: 4px; }
</style>
<script>
// ---- stub chrome API (test only)
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: {
    firstName: "Test", lastName: "Applicant", preferredName: "Tess", email: "test@example.com", phone: "6465550100",
    phoneCountry: "United States of America", country: "United States of America", city: "Springfield", state: "New York",
    address1: "1 Test Street", zip: "10001",
    // applicationLocation not set here: the New York values set below (before the chrome stub) apply.
    linkedin: "https://www.linkedin.com/in/test/", github: "https://github.com/test", website: "https://test.dev",
    source: "LinkedIn", expectedGraduation: "05/2027",
    experiences: [{ company: "Samplesoft", title: "Software Engineering Intern", current: true, startMonth: "6", startYear: "2026" }, { company: "Examplecorp", title: "Engineering Intern", startMonth: "6", startYear: "2025", endMonth: "8", endYear: "2025" }, { company: "Testshop Lab", title: "Research Assistant", startYear: "2024", endYear: "2024" }],
    projectsHighlight: "Form tool (https://github.com/test/form-tool): shows working with AI",
    education: [{ school: "Lakeview University", schoolAliases: "LSU Lakeview University | Lakeland State University at Lakeview", schoolSearch: "Lakeview",
      degreeOptions: "Bachelor of Engineering | BEng | B.E. | BE\nBachelor's Degree | Bachelor's | Bachelors | Bachelor Degree\nBachelor of Science | BS | B.S. | BSc\nUndergraduate",
      field: "Computer Engineering", gpa: "", startYear: "2023", endYear: "2027" }],
    answers: { workAuth: "Yes", sponsorship: "No", employmentType: "Internship", over18: "Yes", previousEmployers: "Examplecorp", travel: "Maximum", restrictions: "None" },
    eeo: { gender: "Non-binary", hispanic: "No", race: "Asian", veteran: "Decline", disability: "Decline" },
    api: { key: "test-key", model: "stub" },
  },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with (settings a fixture
// sets itself are kept; a blank search took the old default search, and the default list when the list was blank too).
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension",
    onMessage: { addListener: (fn) => (onMsg = fn) },
    sendMessage: async (msg) => {
      if (msg.type === "DRAFT") {
        window.__draft = msg;
        return { model: "stub-draft-model", included: { linkedinChars: 0, resumeChars: 0, notesChars: 0, descriptionChars: (msg.job.description || "").length }, answers: msg.questions.map((q) => ({ id: q.id, answer: "I built a small tool that fills forms from a saved profile." + (q.asksForLink ? "\nhttps://github.com/test" : ""), project: "Form tool" })) };
      }
      if (msg.type === "ASK_AI") {
        window.__aiPayload = msg.questions;
        // Yes for the gating questions (HEAD sent them to Claude, so the blocks appeared after the Claude round) and for the
        // research question (only Claude answers it: its block is revealed after the Claude round).
        return { model: "stub-model", answers: msg.questions.map((q) => ({ id: q.id, answer: /degree, or are you studying|work experience, including|research or teaching/i.test(q.question) ? "Yes" : q.type === "textarea" ? "I enjoy building tools." : null, confidence: 0.9 })) };
      }
      return {};
    },
  },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<h1>Software Engineer, EUR</h1>
<div class="job-sidebar"><div><h2>Location</h2><p>Berlin; London; New York</p></div></div>
<!-- Melodex-like Ashby page (fake data; the real markup wasn't available). "Do you have a university degree, or are
     you studying for one?" and "Do you have work experience, including internships?" reveal the education and work
     blocks (answered by rule in the first pass now; on HEAD they went to Claude, the blocks appeared after the Claude
     round and were never filled). "Add another company?" = Yes reveals a second work block; a research question only
     Claude answers reveals a third, after the Claude round (the late-reveal path). Link boxes get one URL. -->
<div class="ashby-application-form-container">
<div class="ashby-application-form-section-container" id="contact"></div>
<div class="ashby-application-form-section-container" id="main"></div>
</div>
<button id="submit" type="submit">Submit Application</button>
<pre id="out"></pre>
<script>
// [section, field path, type, label, block it belongs to (hidden until revealed), block a Yes reveals]
const Q = [
  ["contact", "_systemfield_name", "text", "Name"], ["contact", "_systemfield_email", "text", "Email"],
  ["main", "hasdeg", "yn", "Do you have a university degree, or are you studying for one?", null, "edu"],
  ["main", "uni", "text", "University", "edu"], ["main", "deg", "text", "Degree", "edu"], ["main", "fos", "text", "Field of study", "edu"],
  ["main", "eduStart", "text", "Start year", "edu"], ["main", "eduEnd", "text", "Expected graduation year", "edu"],
  ["main", "still", "yn", "Still studying?", "edu"], ["main", "grade", "text", "Grade / GPA", "edu"], ["main", "adddeg", "yn", "Add a second degree?", "edu"],
  ["main", "haswork", "yn", "Do you have work experience, including internships?", null, "work"],
  ["main", "co1", "text", "Most recent company", "work"], ["main", "role1", "text", "Role", "work"], ["main", "start1", "text", "Start year", "work"],
  ["main", "still1", "yn", "Still work here?", "work"], ["main", "addco", "yn", "Add another company?", "work", "work2"],
  ["main", "co2", "text", "Company", "work2"], ["main", "role2", "text", "Role", "work2"], ["main", "start2", "text", "Start year", "work2"], ["main", "end2", "text", "End year", "work2"],
  ["main", "built", "text", "Link to something you built"], ["main", "portfolio", "text", "Portfolio link"],
  ["main", "emp", "radio", "Employment type", null, null, ["Full-time", "Internship", "Open to both"]],
  ["main", "why", "textarea", "Why do you want to join Melodex?"],
  ["main", "research", "yn", "Have you held a research or teaching position?", null, "work3"],
  ["main", "co3", "text", "Company", "work3"], ["main", "role3", "text", "Role", "work3"], ["main", "start3", "text", "Start year", "work3"], ["main", "end3", "text", "End year", "work3"],
];
const blocks = {};
for (const [sec, id, type, label, block, reveals, opts] of Q) {
  let host = document.getElementById(sec);
  if (block) {
    if (!blocks[block]) {
      blocks[block] = document.createElement("div");
      blocks[block].id = block;
      blocks[block].style.display = "none";
      host.appendChild(blocks[block]);
    }
    host = blocks[block];
  }
  const e = document.createElement("div");
  e.className = "ashby-application-form-field-entry";
  e.dataset.fieldPath = id;
  const lab = `<label class="ashby-application-form-question-title _required_x" for="${id}">${label}</label>`;
  if (type === "text") e.innerHTML = lab + `<input class="ashby-application-form-input-text" id="${id}" name="${id}" type="${id === "_systemfield_email" ? "email" : "text"}">`;
  else if (type === "textarea") e.innerHTML = lab + `<textarea class="ashby-application-form-input-text" id="${id}" name="${id}"></textarea>`;
  else if (type === "radio") e.innerHTML = `<fieldset class="ashby-application-form-input-radio-group">${lab}` + opts.map((o, j) => `<div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="${id}-r${j}" name="${id}"></span><label for="${id}-r${j}">${o}</label></div>`).join("") + `</fieldset>`;
  else e.innerHTML = lab + `<div class="ashby-application-form-input-yesno"${reveals ? ` data-reveal="${reveals}"` : ""}><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" class="_input_1svni_78" tabindex="-1" name="${id}"></div>`;
  host.appendChild(e);
}
// Yes / No: a click sets aria-pressed and the mirror; a group with data-reveal shows (Yes) or hides (No) its block.
document.querySelectorAll(".ashby-application-form-input-yesno").forEach((g) =>
  g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    g.querySelector("input[type=checkbox]").checked = b.dataset.option === "yes";
    if (g.dataset.reveal) setTimeout(() => (document.getElementById(g.dataset.reveal).style.display = b.dataset.option === "yes" ? "" : "none"), 150);
  })));
</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const fields = [...document.querySelectorAll("[data-field-path]")].map((e) => {
    const lab = e.querySelector("label").textContent.trim();
    const g = e.querySelector(".ashby-application-form-input-yesno");
    let v;
    if (g) v = [...g.querySelectorAll("button[aria-pressed=true]")].map((b) => b.textContent).join(",") || "-";
    else if (e.querySelector("input[type=radio]")) v = [...e.querySelectorAll("input:checked")].map((i) => e.querySelector(`label[for="${i.id}"]`).textContent).join(", ") || "-";
    else v = JSON.stringify(e.querySelector("textarea, input").value);
    return e.dataset.fieldPath + " " + lab.slice(0, 50) + " = " + v + " mark=" + (e.closest("[data-wdaf]")?.dataset.wdaf || e.querySelector("[data-wdaf]")?.dataset.wdaf || "-") + (e.offsetParent ? "" : " (hidden)");
  });
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    "DRAFT " + JSON.stringify((window.__draft?.questions || []).map((q) => q.question)),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
