<script>
// ---- react-select look-alike (test only): mousedown on the control opens the menu once the input has seen focus;
// typing filters (data-async lists answer after 600 ms); clicking an option sets the single value; Escape closes. The
// control carries the real page's "Clear selections" / "Toggle flyout" icon buttons.
let rs = 0;
function makeSelect(wrap) {
  const label = wrap.querySelector("label");
  const id = label.getAttribute("for");
  const all = (wrap.dataset.opts || wrap.dataset.async).split("|");
  const isAsync = !!wrap.dataset.async;
  const lbId = "react-select-" + ++rs + "-listbox";
  wrap.classList.add("select__container");
  wrap.insertAdjacentHTML("beforeend",
    `<div class="select-shell"><span aria-live="polite" aria-atomic="false" role="log" class="a11yText"></span><div><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div>` +
    `<div class="select__input-container"><input class="select__input" role="combobox" aria-expanded="false" aria-haspopup="true" aria-autocomplete="list" id="${id}" aria-labelledby="${id}-label" type="text"></div></div>` +
    `<div class="select__indicators"><div aria-hidden="false"><button type=\"button\" class=\"icon-button icon-button--sm\" aria-label=\"Clear selections\"><svg class=\"svg-icon\" fill=\"none\" height=\"20\" width=\"20\" viewBox=\"0 0 24 24\"><path d=\"M4 4h16v16H4z\"></path></svg></button></div><button type=\"button\" class=\"icon-button icon-button--sm\" aria-label=\"Toggle flyout\"><svg class=\"svg-icon\" fill=\"none\" height=\"20\" width=\"20\" viewBox=\"0 0 24 24\"><path d=\"M4 4h16v16H4z\"></path></svg></button></div></div></div></div>`);
  const control = wrap.querySelector(".select__control");
  const input = wrap.querySelector("input");
  let menu = null;
  let timer = null;
  const close = () => { menu?.remove(); menu = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  const render = (list) => {
    if (!menu) {
      menu = document.createElement("div"); menu.className = "select__menu";
      control.after(menu);
      input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", lbId);
    }
    menu.innerHTML = `<div class="select__menu-list" role="listbox" id="${lbId}"></div>`;
    const lb = menu.firstChild;
    if (!list.length) lb.innerHTML = `<div class="select__menu-notice">${isAsync && !input.value ? "Type to search" : "No options"}</div>`;
    for (const t of list) {
      const o = document.createElement("div"); o.className = "select__option"; o.setAttribute("role", "option"); o.textContent = t;
      o.addEventListener("click", () => {
        const vc = wrap.querySelector(".select__value-container");
        vc.querySelector(".select__placeholder, .select__single-value")?.remove();
        vc.insertAdjacentHTML("afterbegin", `<div class="select__single-value">${t}</div>`);
        input.value = ""; close();
      });
      lb.appendChild(o);
    }
  };
  const filtered = () =>
    wrap.dataset.maxwords && input.value.trim().split(/\s+/).length > +wrap.dataset.maxwords
      ? []
      : all.filter((t) => !input.value || t.toLowerCase().includes(input.value.toLowerCase()));
  let focused = false;
  input.addEventListener("focusin", () => (focused = true));
  input.addEventListener("focusout", () => { focused = false; close(); });
  control.addEventListener("mousedown", () => { if (!focused) return; menu ? close() : render(isAsync ? [] : filtered()); });
  input.addEventListener("input", () => {
    clearTimeout(timer);
    if (isAsync) { render([]); timer = setTimeout(() => render(input.value ? filtered() : []), 600); }
    else render(filtered());
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.key === "ArrowDown" && !menu) render(isAsync ? [] : filtered());
  });
}
document.querySelectorAll(".react-select").forEach(makeSelect);
// "Current role": the End date row is removed while the box is ticked and put back (empty) when it's unticked.
function wireCurrent(entry) {
  const cb = entry.querySelector('input[type="checkbox"]');
  let endRow = [...entry.querySelectorAll(".date-row")].find((r) => /End date/.test(r.textContent));
  const sync = (log = true) => {
    const shown = [...entry.querySelectorAll(".date-row")].find((r) => /End date/.test(r.textContent));
    if (cb.checked && shown) { endRow = shown; shown.remove(); if (log) window.__toggles = (window.__toggles || []).concat("End date hidden"); }
    else if (!cb.checked && !shown) {
      endRow = endRow.cloneNode(true);
      endRow.querySelectorAll("input[type=text]").forEach((i) => (i.value = ""));
      endRow.querySelector(".select__single-value")?.remove();
      entry.querySelector(".checkbox").before(endRow);
      endRow.querySelectorAll(".react-select").forEach((w) => { w.querySelector(".select-shell")?.remove(); makeSelect(w); });
      window.__toggles = (window.__toggles || []).concat("End date revealed");
    }
  };
  cb.addEventListener("change", () => setTimeout(sync, 150));
  sync(false);
}
document.querySelectorAll(".employment--container .employment-form").forEach(wireCurrent);

type=\"text\" maxlength=\"255\" value=\"\"></div></div></div>\n      <div class=\"date-row\"><div class=\"select\"><div class=\"select__container react-select\" data-opts=\"January|February|March|April|May|June|July|August|September|October|November|December\"><label id=\"end-date-month-IDX-label\" for=\"end-date-month-IDX\" class=\"label select__label\">End date month</label></div></div><div class=\"text-input-wrapper\"><div class=\"input-wrapper\"><label id=\"end-date-year-IDX-label\" for=\"end-date-year-IDX\" class=\"label label\">End date year</label><input id=\"end-date-year-IDX\" class=\"input input__single-line\" aria-label=\"End date year\" aria-describedby=\"end-date-year-IDX-description end-date-year-IDX-error end-date-year-IDX-help\" aria-invalid=\"false\" aria-required=\"false\" type=\"text\" maxlength=\"255\" value=\"\"></div></div></div>\n      <div class=\"checkbox\" id=\"current-role-IDX\"><div class=\"checkbox__wrapper\"><div class=\"checkbox__input\"><input aria-required=\"false\" type=\"checkbox\" id=\"current-role-IDX_1\" name=\"current-role-IDX\" aria-invalid=\"false\" value=\"1\"><svg class=\"svg-icon\" fill=\"none\" height=\"16\" width=\"16\" viewBox=\"0 0 16 16\"><path d=\"M2 8l4 4 8-8\"></path></svg></div><label for=\"current-role-IDX_1\">Current role</label></div></div>\n    </div>";

<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  // One line per labelled control: the text input's value, the react-select's shown value, or the checkbox state.
  const line = (prefix, lab) => {
    const id = lab.getAttribute("for");
    const ctrl = document.getElementById(id);
    if (!ctrl) return null;
    const wrap = ctrl.closest(".select__container");
    const v = wrap ? (wrap.querySelector(".select__single-value")?.textContent || "") : ctrl.type === "checkbox" ? (ctrl.checked ? "checked" : "unchecked") : ctrl.value;
    const marked = ctrl.closest("[data-wdaf]") || (wrap || ctrl.parentElement).querySelector("[data-wdaf]");
    return "FIELD " + prefix + lab.textContent.replace(/\*/g, "").trim().slice(0, 40) + " = " + JSON.stringify(v) + " mark=" + ((marked && marked.dataset.wdaf) || "-");
  };
  const fields = [];
  document.querySelectorAll(".employment--container .employment-form").forEach((e, i) => e.querySelectorAll("label[for]").forEach((l) => { const t = line("Employment " + (i + 1) + ": ", l); if (t) fields.push(t); }));
  document.querySelectorAll(".education-form label[for]").forEach((l) => { const t = line("Education: ", l); if (t) fields.push(t); });
  document.querySelectorAll("form > .field-wrapper label[for]").forEach((l) => { const t = line("", l); if (t) fields.push(t); });
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "NAV " + JSON.stringify(window.__nav || []),
    "TOGGLES " + JSON.stringify(window.__toggles || []),
    "ADDED employment " + (window.__added || 0) + ", education " + (window.__eduAdded || 0),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields,
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
