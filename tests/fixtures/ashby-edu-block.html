<!doctype html>
<html>
<head>

<style>
  body { font: 14px sans-serif; }
  .ashby-application-form-field-entry { margin: 10px 0; position: relative; }
  .ashby-application-form-input-yesno { display: flex; gap: 4px; position: relative; }

<script>
// ---- stub chrome API (test only)
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: {
    firstName: "Test", lastName: "Applicant", preferredName: "Tess", email: "test@example.com", phone: "6465550100",
    phoneCountry: "United States of America", country: "United States of America", city: "Springfield", state: "New York",
    address1: "1 Test Street", zip: "10001",
    // applicationLocation not set here: the New York values set below (before the chrome stub) apply.
    linkedin: "https://www.linkedin.com/in/test/", github: "https://github.com/test", website: "https://test.dev",
    source: "LinkedIn", expectedGraduation: "05/2027",
    experiences: [{ company: "Examplecorp", title: "Engineering Intern" }],
    education: [{ school: "Lakeview University", schoolAliases: "LSU Lakeview University", schoolSearch: "Lakeview",
      degreeOptions: "Bachelor of Engineering | BEng\nBachelor's Degree | Bachelor's", field: "Computer Engineering", startYear: "2023", endYear: "2027" }],
    answers: { workAuth: "Yes", sponsorship: "No", over18: "Yes", previousEmployers: "Examplecorp", travel: "Maximum", restrictions: "None" },
    eeo: { gender: "Non-binary", hispanic: "No", race: "Black or African American", veteran: "Decline", disability: "Decline" },
    api: { key: "test-key", model: "stub" },
  },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
  resumeFile: { name: "resume-test.pdf", type: "application/pdf", dataUrl: "data:application/pdf;base64,JVBERi0xLjQK" },
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with (settings a fixture
// sets itself are kept; a blank search took the old default search, and the default list when the list was blank too).
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension",
    onMessage: { addListener: (fn) => (onMsg = fn) },
    sendMessage: async (msg) => {
      if (msg.type === "DRAFT") {
        window.__draft = msg;
        return { model: "stub-draft-model", included: { linkedinChars: 0, resumeChars: 0, notesChars: 0, descriptionChars: (msg.job.description || "").length }, answers: msg.questions.map((q) => (/blockchain/i.test(q.question) ? { id: q.id, answer: null, reason: "No blockchain experience in the materials." } : { id: q.id, answer: "I enjoy building tools — mostly data ones, and this role would let me build more of them for real users." })) };
      }
      if (msg.type === "ASK_AI") {
        window.__aiPayload = msg.questions;
        return { model: "stub-model", answers: msg.questions.map((q) => ({ id: q.id, answer: q.type === "textarea" ? "I enjoy building tools." : null, confidence: 0.9 })) };
      }
      return {};
    },
  },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<h1>Research Engineer</h1>
<!-- Cascade-Research-like Ashby page (fake data; the real education markup hasn't been seen): an education
     entry with School (a combobox whose results read "name / country / domain" on three lines; a pick puts
     only the name in the box), Degree, Start Date and End Date as Month + Year dropdowns, and "Still
     Student?". The date controls have no label or aria-label: only a "Month..." / "Year..." placeholder element
     (as on the real page). The profile has a start year but no start month. Plus "Are you able to work onsite
     in NYC?" as an Ashby Yes / No checkbox group (as on the real page; no job location on the page). -->
<div class="ashby-application-form-container">
  <div class="ashby-application-form-section-container">
    <div class="ashby-application-form-field-entry" data-field-path="_systemfield_name"><label class="ashby-application-form-question-title" for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" class="ashby-application-form-input-text"></div>
    <div class="ashby-application-form-field-entry" data-field-path="edu-entry"><label class="ashby-application-form-question-title">Education</label>
      <div class="edu-entry">
        <div class="ashby-application-form-field-entry" data-field-path="edu-school"><label class="ashby-application-form-question-title" for="edu-school">School</label><input id="edu-school" class="ashby-application-form-input-autocomplete" placeholder="Start typing..." aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" role="combobox" value=""></div>
        <div class="ashby-application-form-field-entry" data-field-path="edu-degree"><label class="ashby-application-form-question-title" for="edu-degree">Degree</label><input id="edu-degree" type="text" class="ashby-application-form-input-text"></div>
        <div class="edu-dates"><div class="edu-date"><label class="ashby-application-form-question-title">Start Date</label><div class="date-pair"><div class="ashby-select"><div class="_placeholder_x1 select-placeholder">Month...</div><input role="combobox" aria-haspopup="listbox" aria-expanded="false" class="date-combo" name="edu-start-month" data-kind="month" value=""></div><div class="ashby-select"><div class="_placeholder_x1 select-placeholder">Year...</div><input role="combobox" aria-haspopup="listbox" aria-expanded="false" class="date-combo" name="edu-start-year" data-kind="year" value=""></div></div></div>
        <div class="edu-date"><label class="ashby-application-form-question-title">End Date</label><div class="date-pair"><div class="ashby-select"><div class="_placeholder_x1 select-placeholder">Month...</div><input role="combobox" aria-haspopup="listbox" aria-expanded="false" class="date-combo" name="edu-end-month" data-kind="month" value=""></div><div class="ashby-select"><div class="_placeholder_x1 select-placeholder">Year...</div><input role="combobox" aria-haspopup="listbox" aria-expanded="false" class="date-combo" name="edu-end-year" data-kind="year" value=""></div></div></div></div>
        <label class="edu-current"><input type="checkbox" name="edu-current"> Still Student?</label>
      </div>
    </div>
    <div data-field-path="onsite" data-field-entry-id="e1_onsite"><fieldset class="_container_1258i_28 _fieldEntry_1e3gg_28 ashby-application-form-input-checkbox-group"><label class="_heading_f7cvd_52 _required_f7cvd_91 _label_1e3gg_42 ashby-application-form-question-title" for="onsite">Are you able to work onsite in NYC?</label><div class="_option_1258i_34 ashby-application-form-input-checkbox-group-option"><span class="ashby-application-form-input-checkbox-group-option-checkbox _container_1danv_28" data-disabled="false"><input type="checkbox" id="e1_onsite-labeled-checkbox-0" name="Yes"></span><label for="e1_onsite-labeled-checkbox-0" class="_label_1258i_42  ashby-application-form-input-checkbox-group-option-label">Yes</label></div><div class="_option_1258i_34 ashby-application-form-input-checkbox-group-option"><span class="ashby-application-form-input-checkbox-group-option-checkbox _container_1danv_28" data-disabled="false"><input type="checkbox" id="e1_onsite-labeled-checkbox-1" name="No"></span><label for="e1_onsite-labeled-checkbox-1" class="_label_1258i_42  ashby-application-form-input-checkbox-group-option-label">No</label></div></fieldset></div>
  </div>
</div>
<button id="submit" type="submit">Submit Application</button>
<pre id="out"></pre>
<script>
const setVal = (el, v) => Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(el, v);
document.querySelectorAll(".ashby-application-form-input-yesno").forEach((g) =>
  g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    g.querySelector("input[type=checkbox]").checked = b.dataset.option === "yes";
  })));
// Date dropdowns: the whole list on mousedown; a click puts the option in the box and hides the placeholder.
const MONTHS = "January February March April May June July August September October November December".split(" ");
const YEARS = Array.from({ length: 14 }, (_, i) => String(2018 + i));
document.querySelectorAll(".date-combo").forEach((input, n) => {
  const items = input.dataset.kind === "month" ? MONTHS : YEARS;
  const ph = input.parentElement.querySelector(".select-placeholder");
  let list = null;
  const close = () => { list?.remove(); list = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  input.addEventListener("mousedown", () => {
    if (list) return close();
    list = document.createElement("div"); list.className = "combo-list"; list.setAttribute("role", "listbox"); list.id = "date-listbox-" + n;
    for (const t of items) {
      const o = document.createElement("div"); o.setAttribute("role", "option"); o.textContent = t;
      o.addEventListener("click", () => { setVal(input, t); ph.style.display = "none"; close(); });
      list.appendChild(o);
    }
    document.body.appendChild(list);
    input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", list.id);
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
});
// School: results 500 ms after typing, each option three lines (name / country / domain); a click puts the
// NAME in the box; leaving without a pick clears it.
(() => {
  const input = document.getElementById("edu-school");
  const all = [["Lakeview University", "United States", "lakeview.edu"], ["Lakeview School", "United States", "stonybrookschool.org"], ["University of Toronto", "Canada", "utoronto.ca"]];
  let list = null, timer = null, picked = "";
  const close = () => { list?.remove(); list = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  const render = (items) => {
    if (!list) {
      list = document.createElement("div"); list.className = "combo-list"; list.setAttribute("role", "listbox"); list.id = "school-listbox";
      document.body.appendChild(list);
      input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", "school-listbox");
    }
    list.innerHTML = "";
    for (const [name, country, domain] of items) {
      const o = document.createElement("div"); o.setAttribute("role", "option");
      o.innerHTML = `<div class="name">${name}</div><div class="country">${country}</div><div class="domain">${domain}</div>`;
      o.addEventListener("click", () => { setVal(input, name); picked = name; close(); });
      list.appendChild(o);
    }
  };
  input.addEventListener("mousedown", () => (list ? close() : render([])));
  input.addEventListener("input", () => {
    picked = ""; clearTimeout(timer); render([]);
    timer = setTimeout(() => render(input.value ? all.filter((t) => t[0].toLowerCase().includes(input.value.toLowerCase())) : []), 500);
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  input.addEventListener("focusout", () => setTimeout(() => { close(); if (!picked) setVal(input, ""); }, 0));
})();
</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const out = [];
  const mark = (el) => el.closest("[data-wdaf]")?.dataset.wdaf || el.querySelector?.("[data-wdaf]")?.dataset.wdaf || "-";
  for (const [name, sel] of [["Name", "#_systemfield_name"], ["School", "#edu-school"], ["Degree", "#edu-degree"], ["Start month", "[name=edu-start-month]"], ["Start year", "[name=edu-start-year]"], ["End month", "[name=edu-end-month]"], ["End year", "[name=edu-end-year]"]]) {
    const el = document.querySelector(sel);
    out.push(name + " = " + JSON.stringify(el.value) + " mark=" + mark(el));
  }
  const cur = document.querySelector("[name=edu-current]");
  out.push("Still Student? = " + cur.checked + " mark=" + mark(cur));
  const og = document.querySelector("[data-field-path=onsite]");
  out.push("Onsite in NYC = checked:" + [...og.querySelectorAll("input:checked")].map((i) => i.name).join(",") + " mark=" + mark(og.querySelector("fieldset")));
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...out.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
