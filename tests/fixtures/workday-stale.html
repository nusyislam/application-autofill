<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Careers</title>
<style>
  body { font: 14px sans-serif; }
  [role=listbox] { position: absolute; background: #fff; border: 1px solid #999; width: 320px; max-height: 200px; overflow: auto; z-index: 5; }
  [role=option] { padding: 4px; min-height: 20px; }
  .ff { margin: 10px 0; }
</style>
<script>
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: {
    firstName: "Test", lastName: "Applicant",
    skills: "Data Wrangling, Fortran Basics, Nonexistent Skill, GIMP Retouching",
    experiences: [], education: [], languages: [], answers: {}, eeo: {}, api: { key: "" },
  },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
  resumeFile: { name: "resume-test.pdf", type: "application/pdf", dataUrl: "data:application/pdf;base64,JVBERi0xLjQK" },
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with (settings a fixture
// sets itself are kept; a blank search took the old default search, and the default list when the list was blank too).
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension", onMessage: { addListener: (fn) => (onMsg = fn) }, sendMessage: async () => ({ model: "stub", answers: [] }) },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<div data-automation-id="progressBar"><div data-automation-id="progressBarActiveStep">My Experience</div></div>
<h2>My Experience</h2>
<div data-automation-id="resumeSection"><h3>Resume/CV</h3>
  <div data-automation-id="file-upload-successful" class="uploaded"><div data-automation-id="file-upload-item-name">resume 7.7.pdf</div><button data-automation-id="delete-file" aria-label="Delete file">&#128465;</button></div>
  <div data-automation-id="file-upload-drop-zone">Drop files here<input type="file" data-automation-id="file-upload-input-ref"></div></div>
<!-- A flaky skills search (fake data), like DataPilot's: the popup element is reused, so a
     "No Items." after a "No Items." looks unchanged since Enter. "Fortran Basics" shows "No Items." on
     its first search only; "GIMP Retouching" on its first two; "Nonexistent Skill" always.
     The resume section already lists "resume 7.7.pdf" (after "Use my last application"); it must be replaced with the resume from Options. The step changes 4 s into the fill (the progress bar's
     active step), during the skill searches: the run must stop with one line, no retries; then the skills field
     is gone and a second fill runs on the new step. -->
<div class="ff" data-automation-id="formField-skills"><label>Type to Add Skills</label>
  <div data-automation-id="multiselectInputContainer"><input type="text" data-items="Data Wrangling|Fortran Basics|GIMP Retouching|InkScape Diagramming"></div></div>
<pre id="out"></pre>

<script>
// ---- Workday-like skills search (test only), with a reused popup and transient "No Items.".
window.__searches = [];
const FLAKY = { "avr assembly": 1, "orcad pspice": 2 };
const tries = {};
const inp = document.querySelector("[data-automation-id=multiselectInputContainer] input");
const field = inp.closest("[data-automation-id^=formField]");
let lb = null;
const render = (items) => {
  const sig = items.join("|") || "No Items.";
  if (lb && lb.isConnected && lb.dataset.sig === sig) return; // same content: the popup stays as it is
  if (!lb || !lb.isConnected) {
    lb = document.createElement("div");
    lb.setAttribute("data-automation-id", "activeListContainer"); lb.setAttribute("role", "listbox");
    field.appendChild(lb);
  }
  lb.dataset.sig = sig;
  lb.innerHTML = "";
  for (const t of items.length ? items : ["No Items."]) {
    const row = document.createElement("div"); row.setAttribute("role", "option"); row.setAttribute("data-automation-id", "menuItem");
    const leaf = document.createElement("div"); leaf.setAttribute("data-automation-id", "promptLeafNode");
    const po = document.createElement("div"); po.setAttribute("data-automation-id", "promptOption"); po.textContent = t;
    if (items.length) po.addEventListener("click", () => { const chip = document.createElement("div"); chip.setAttribute("data-automation-id", "selectedItem"); chip.textContent = t; field.appendChild(chip); });
    leaf.appendChild(po); row.appendChild(leaf); lb.appendChild(row);
  }
};
// Resume: delete removes the listed file; a new file is listed by name.
const sec = document.querySelector("[data-automation-id=resumeSection]");
sec.querySelector("[data-automation-id=delete-file]").addEventListener("click", () => sec.querySelector(".uploaded").remove());
sec.querySelector("input[type=file]").addEventListener("change", (e) => {
  const d = document.createElement("div"); d.className = "uploaded"; d.setAttribute("data-automation-id", "file-upload-successful");
  d.innerHTML = `<div data-automation-id="file-upload-item-name">${e.target.files[0].name}</div>`;
  sec.insertBefore(d, sec.querySelector("[data-automation-id=file-upload-drop-zone]"));
});
inp.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return; // the popup stays open between searches, as on DataPilot
  if (e.key !== "Enter") return;
  const q = inp.value.trim().toLowerCase();
  window.__searches.push(q);
  tries[q] = (tries[q] || 0) + 1;
  const items = inp.dataset.items.split("|").filter((t) => q && t.toLowerCase().includes(q));
  render(tries[q] <= (FLAKY[q] || 0) ? [] : items);
});
</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  let stats;
  setTimeout(() => (document.querySelector("[data-automation-id=progressBarActiveStep]").textContent = "Application Questions"), 4000);
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const searchesFirst = window.__searches.length;
  window.__logs.push("---- second fill (new step, no skills field) ----");
  field.remove();
  let stats2;
  try { stats2 = await window.__runFill(); } catch (e) { window.__errors.push("run 2: " + e.stack); }
  const skills = [...field.querySelectorAll("[data-automation-id=selectedItem]")].map((x) => x.textContent);
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "SKILLS " + JSON.stringify(skills),
    "RESUME " + JSON.stringify([...document.querySelectorAll("[data-automation-id=file-upload-item-name]")].map((x) => x.textContent)),
    "SEARCHES " + JSON.stringify(window.__searches) + " (first fill " + searchesFirst + ")",
    "STATS 2 " + JSON.stringify(stats2),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
