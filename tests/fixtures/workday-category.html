<!doctype html>

<head>

<title>Careers</title>
<style>
  body { font: 14px sans-serif; }
  [role=listbox] { position: absolute; background: #fff; border: 1px solid #999; width: 320px; max-height: 200px; overflow: auto; z-index: 5; }
  [role=option] { padding: 4px; min-height: 20px; }
  .ff { margin: 10px 0; }
  section { border: 1px solid #ccc; margin: 12px 0; padding: 8px; }
</style>
<script>
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: { firstName: "N", lastName: "I", source: "LinkedIn", phoneType: "Mobile", answers: {}, eeo: {}, api: { key: "" } },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
  resumeFile: { name: "resume-test.pdf", type: "application/pdf", dataUrl: "data:application/pdf;base64,JVBERi0xLjQK" },
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with (settings a fixture
// sets itself are kept; a blank search took the old default search, and the default list when the list was blank too).
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension", onMessage: { addListener: (fn) => (onMsg = fn) }, sendMessage: async () => ({ model: "stub", answers: [] }) },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<h2>My Information</h2>
<div class="ff" data-automation-id="formField-source"><label>How Did You Hear About Us?<abbr>*</abbr></label>
  <div data-automation-id="multiselectInputContainer"><input type="text" id="srcInput"></div></div>
<script>
// Category prompt (test only): click shows categories; a category shows its options; Enter does nothing.
const CATS = { "Associations": ["SWE", "NSBE"], "Event/Conference": ["GTC"], "Job Board": ["Indeed", "LinkedIn Jobs", "Handshake"], "Social Media": ["Facebook", "Instagram"], "University": ["Career Fair"], "Website": ["NVEXA Careers"] };
const srcField = document.querySelector("[data-automation-id=formField-source]");
const srcInput = document.getElementById("srcInput");
function srcPopup(rows, isCat) {
  document.querySelectorAll("#srcList").forEach((x) => x.remove());
  const lb = document.createElement("div");
  lb.id = "srcList"; lb.setAttribute("data-automation-id", "activeListContainer"); lb.setAttribute("role", "listbox");
  for (const t of rows) {
    const row = document.createElement("div"); row.setAttribute("role", "option"); row.setAttribute("data-automation-id", "menuItem");
    const leaf = document.createElement("div"); leaf.setAttribute("data-automation-id", "promptLeafNode");
    leaf.setAttribute("data-uxi-multiselectlistitem-hassidecharm", isCat ? "true" : "false");
    const po = document.createElement("div"); po.setAttribute("data-automation-id", "promptOption"); po.textContent = t;
    po.addEventListener("click", () => {
      if (isCat) return srcPopup(CATS[t], false);
      srcField.querySelectorAll("[data-automation-id=selectedItem]").forEach((c) => c.remove());
      const chip = document.createElement("div"); chip.setAttribute("data-automation-id", "selectedItem"); chip.textContent = t;
      srcField.appendChild(chip); lb.remove();
    });
    leaf.appendChild(po); row.appendChild(leaf); lb.appendChild(row);
  }
  srcField.appendChild(lb);
}
srcInput.addEventListener("click", () => srcPopup(Object.keys(CATS), true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll("#srcList").forEach((x) => x.remove()); });
</script>
<div class="ff" data-automation-id="formField-phoneType"><label>Phone Device Type<abbr>*</abbr></label>
  <button aria-haspopup="listbox" aria-expanded="false" data-opts="Select One|Home|Home Cellular">Select One</button></div><div data-automation-id="pageFooter"><button type="button" data-automation-id="pageFooterBackButton" onclick="window.__nav = (window.__nav || []).concat('Back')">Back</button>
<button type="button" data-automation-id="pageFooterNextButton" onclick="window.__nav = (window.__nav || []).concat('Save and Continue')">Save and Continue</button></div>
<pre id="out"></pre>

<template id="work"><div class="panel">
  <div class="ff" data-automation-id="formField-jobTitle"><label>Job Title<abbr>*</abbr></label><input type="text"></div>
  <div class="ff" data-automation-id="formField-companyName"><label>Company<abbr>*</abbr></label><input type="text"></div>
</div></template>
<template id="edu"><div class="panel">
  <div class="ff" data-automation-id="formField-school"><label>School or University<abbr>*</abbr></label>
    <div data-automation-id="multiselectInputContainer"><input type="text" data-items="LSU Lakeview University|Boston University|Lakeview Medicine"></div></div>
  <div class="ff" data-automation-id="formField-degree"><label>Degree<abbr>*</abbr></label>
    <button aria-haspopup="listbox" aria-expanded="false" data-opts="Select One|Bachelor of Science|Bachelor in Business Administration|Bachelor of Engineering|Bachelor of Laws">Select One</button></div>
  <div class="ff" data-automation-id="formField-fieldOfStudy"><label>Field of Study</label>
    <div data-automation-id="multiselectInputContainer"><input type="text" data-items="Computer Engineering|Computer Science"></div></div>
</div></template>
<template id="lang"><div class="panel">
  <div class="ff" data-automation-id="formField-language"><label>Language<abbr>*</abbr></label>
    <button aria-haspopup="listbox" aria-expanded="false" data-opts="Select One|Italiano|English|Spanish">Select One</button></div>

    <button aria-haspopup="listbox" aria-expanded="false" data-opts="Select One|Basic|Intermediate|Fluent">Select One</button></div>

<template id="web"><div class="panel">
  <div class="ff" data-automation-id="formField-url"><label>URL<abbr>*</abbr></label><input type="text"></div>
</div></template>

<script>
// ---- Workday-like widgets (test only)
let n = 0;
function wireDropdowns(root) {
  for (const btn of root.querySelectorAll("button[aria-haspopup=listbox]")) {
    if (btn.dataset.wired) continue;
    btn.dataset.wired = "1";
    const id = "lb" + n++;
    btn.setAttribute("aria-controls", id);
    btn.addEventListener("click", () => {
      let lb = document.getElementById(id);
      if (btn.getAttribute("aria-expanded") === "true") { lb && lb.remove(); btn.setAttribute("aria-expanded", "false"); return; }
      lb = document.createElement("div");
      lb.id = id; lb.setAttribute("role", "listbox");
      for (const t of btn.dataset.opts.split("|")) {
        const o = document.createElement("div"); o.setAttribute("role", "option"); o.textContent = t;
        o.addEventListener("click", () => { btn.textContent = t; lb.remove(); btn.setAttribute("aria-expanded", "false"); });
        lb.appendChild(o);
      }
      btn.after(lb);
      btn.setAttribute("aria-expanded", "true");
    });
  }
}
// Search prompt: Enter shows activeListContainer with checkbox rows (or "No Items."); ticking adds a chip.
function wireSearch(root) {
  for (const inp of root.querySelectorAll("[data-automation-id=multiselectInputContainer] input")) { if (!inp.dataset.items) continue;
    if (inp.dataset.wired) continue;
    inp.dataset.wired = "1";
    const field = inp.closest("[data-automation-id^=formField]");
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { document.querySelectorAll("[data-automation-id=activeListContainer]").forEach((x) => x.remove()); return; }
      if (e.key !== "Enter") return;
      document.querySelectorAll("[data-automation-id=activeListContainer]").forEach((x) => x.remove());
      const q = inp.value.toLowerCase();
      const items = inp.dataset.items.split("|").filter((t) => q && t.toLowerCase().includes(q.split(" ")[0]));
      const lb = document.createElement("div");
      lb.setAttribute("data-automation-id", "activeListContainer"); lb.setAttribute("role", "listbox");
      for (const t of items.length ? items : ["No Items."]) {
        const row = document.createElement("div"); row.setAttribute("role", "option"); row.setAttribute("data-automation-id", "menuItem");
        const leaf = document.createElement("div"); leaf.setAttribute("data-automation-id", "promptLeafNode");
        if (items.length) {
          const cb = document.createElement("input"); cb.type = "checkbox"; cb.setAttribute("data-automation-id", "checkboxPanel");
          cb.addEventListener("click", () => {
            if (!cb.checked) return;
            const chip = document.createElement("div"); chip.setAttribute("data-automation-id", "selectedItem"); chip.textContent = t;
            field.appendChild(chip);
          });
          leaf.appendChild(cb);
        }
        const po = document.createElement("div"); po.setAttribute("data-automation-id", "promptOption"); po.textContent = t;
        if (items.length) po.addEventListener("click", () => { const chip = document.createElement("div"); chip.setAttribute("data-automation-id", "selectedItem"); chip.textContent = t; field.appendChild(chip); });
        leaf.appendChild(po); row.appendChild(leaf); lb.appendChild(row);
      }
      field.appendChild(lb);
    });
  }
}
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  for (const b of document.querySelectorAll("button[aria-expanded=true]")) { document.getElementById(b.getAttribute("aria-controls"))?.remove(); b.setAttribute("aria-expanded", "false"); }
});
for (const btn of document.querySelectorAll("button[data-tpl]")) {
  btn.addEventListener("click", () => {
    const panel = document.getElementById(btn.dataset.tpl).content.firstElementChild.cloneNode(true);
    btn.closest("section").querySelector(".panels").appendChild(panel);
    wireDropdowns(panel); wireSearch(panel);
  });
}
wireSearch(document); wireDropdowns(document);
// One pre-existing website panel holding the GitHub URL (must be skipped, not overwritten).



</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const fields = [...document.querySelectorAll("[data-automation-id^=formField]")].map((c) => {
    const ctrl = c.querySelector("input:not([type=radio]):not([type=file]),textarea,button");
    const chips = [...c.querySelectorAll("[data-automation-id=selectedItem]")].map((x) => x.textContent);
    const val = chips.length ? "chips:" + chips.join(",") : ctrl ? (ctrl.type === "checkbox" ? "checked:" + ctrl.checked : ctrl.tagName === "BUTTON" ? ctrl.textContent : ctrl.value) : "";
    return c.getAttribute("data-automation-id") + " = " + JSON.stringify(val) + " mark=" + (c.dataset.wdaf || "-");
  });
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")), "NAV " + JSON.stringify(window.__nav || []), "GUARD " + JSON.stringify([...document.querySelectorAll("[data-automation-id=pageFooter] button")].map((b) => [b.textContent, AAF.click(b)])), "NAV-AFTER-GUARD " + JSON.stringify(window.__nav || []),
    
    "LANGTAG " + !!document.querySelector("[data-wdaf-lang]"),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
