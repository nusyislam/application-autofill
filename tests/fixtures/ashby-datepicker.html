<script>
const setVal = (el, v) => Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(el, v);
// Graduation Date: a calendar-picker box (Nimbus). A controlled input: its value comes from the picker's state, so
// a value written straight in reverts; a typed digit is run through a broken auto-format ("01/01/52120"); select all
// + Backspace / Delete empties it. Clicking (or focusing) it opens a calendar on the month of the state's date, even
// a garbled one ("January 52120"), else today's month: a "‹" / "›" header, 6 weeks of day buttons (neighbouring
// months' days greyed, "dp-day--outside"). Clicking a day sets the state and closes it; Escape closes it.
(() => {
  const el = document.getElementById("grad");
  const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  let state = el.value;
  let pop = null;
  let view = null;
  const show = () => setVal(el, state);
  const garble = (s) => "01/01/" + ("2000" + s.replace(/\D/g, "")).slice(-5);
  const two = (n) => String(n).padStart(2, "0");
  const viewOf = () => {
    const m = state.match(/^(\d\d)\/(\d\d)\/(\d+)$/);
    if (m) return { y: +m[3], m: +m[1] };
    const t = new Date();
    return { y: t.getFullYear(), m: t.getMonth() + 1 };
  };
  const close = () => { pop?.remove(); pop = null; };
  const render = () => {
    if (!pop) {
      pop = document.createElement("div");
      pop.className = "react-datepicker dp";
      pop.setAttribute("role", "dialog");
      pop.style.cssText = "position:absolute;background:#fff;border:1px solid #999;padding:6px;z-index:9";
      document.body.appendChild(pop);
      const r = el.getBoundingClientRect();
      pop.style.left = r.left + scrollX + "px"; pop.style.top = r.bottom + scrollY + "px";
    }
    const { y, m } = view;
    const first = new Date(Math.min(y, 9999), m - 1, 1);
    const lead = first.getDay();
    const days = new Date(Math.min(y, 9999), m, 0).getDate();
    const prevDays = new Date(Math.min(y, 9999), m - 1, 0).getDate();
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const n = i - lead + 1;
      if (n < 1) cells += `<button type="button" class="dp-day dp-day--outside">${prevDays + n}</button>`;
      else if (n > days) cells += `<button type="button" class="dp-day dp-day--outside">${n - days}</button>`;
      else cells += `<button type="button" class="dp-day" aria-label="Choose ${MON[m - 1]} ${n}, ${y}" data-d="${n}">${n}</button>`;
    }
    pop.innerHTML = `<div class="dp-header"><button type="button" class="dp-prev" aria-label="Previous Month">‹</button><span class="dp-title">${MON[m - 1]} ${y}</span><button type="button" class="dp-next" aria-label="Next Month">›</button></div><div role="grid" class="dp-grid">${cells}</div>`;
    pop.querySelector(".dp-prev").onclick = () => { view = view.m === 1 ? { y: view.y - 1, m: 12 } : { y: view.y, m: view.m - 1 }; render(); };
    pop.querySelector(".dp-next").onclick = () => { view = view.m === 12 ? { y: view.y + 1, m: 1 } : { y: view.y, m: view.m + 1 }; render(); };
    pop.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { state = `${two(view.m)}/${two(b.dataset.d)}/${view.y}`; show(); close(); }));
  };
  const open = () => { if (!pop) { view = viewOf(); render(); } };
  el.addEventListener("click", open);
  el.addEventListener("focus", open);
  el.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return close();
    if (e.key === "Backspace" || e.key === "Delete") {
      e.preventDefault();
      state = el.selectionStart === 0 && el.selectionEnd === el.value.length ? "" : state.slice(0, -1);
      show();
      if (pop) { view = viewOf(); render(); }
      return;
    }
    if (/^\d$/.test(e.key)) {
      e.preventDefault();
      state = garble(state + e.key);
      show();
      if (pop) { view = viewOf(); render(); }
    }
  });
  el.addEventListener("beforeinput", (e) => e.preventDefault());
  el.addEventListener("input", show);
  el.addEventListener("change", show);
})();
// Expected degree completion date: an input mask over "MM/DD/YYYY". A typed digit (beforeinput insertText) fills the
// next free slot and the mask cancels the event; anything else is cancelled. A value written straight into the box is
// re-masked from its digits (emptied = the template again). Old typing set each digit as well, so every digit landed
// twice.
(() => {
  const el = document.getElementById("grad2");
  const TPL = "MM/DD/YYYY";
  const slots = [...TPL].map((c, i) => (c === "/" ? -1 : i)).filter((i) => i >= 0);
  const render = (digits) => {
    const out = [...TPL];
    digits.slice(0, slots.length).split("").forEach((d, k) => (out[slots[k]] = d));
    return out.join("");
  };
  const digitsOf = (v) => (v.match(/\d/g) || []).join("");
  el.addEventListener("beforeinput", (e) => {
    e.preventDefault();
    if (e.inputType === "insertText" && /^\d$/.test(e.data || "")) setVal(el, render(digitsOf(el.value) + e.data));
    if (e.inputType === "deleteContentBackward") setVal(el, render(digitsOf(el.value).slice(0, -1)));
  });
  el.addEventListener("input", () => setVal(el, render(digitsOf(el.value))));
})();
document.querySelectorAll(".ashby-application-form-input-yesno").forEach((g) =>
  g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    g.querySelector("input[type=checkbox]").checked = b.dataset.option === "yes";
  })));
// School: results 500 ms after typing, each option three lines (name / country / domain); a click puts the
// NAME in the box; leaving without a pick clears it.
(() => {
  const input = document.getElementById("school");
  const all = [["Lakeview University", "United States", "lakeview.edu"], ["Lakeview School", "United States", "stonybrookschool.org"], ["University of Toronto", "Canada", "utoronto.ca"]];
  let list = null, timer = null, picked = "";
  const close = () => { list?.remove(); list = null; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-controls"); };
  const render = (items) => {
    if (!list) {
      list = document.createElement("div"); list.className = "combo-list"; list.setAttribute("role", "listbox"); list.id = "school-listbox";
      document.body.appendChild(list);
      input.setAttribute("aria-expanded", "true"); input.setAttribute("aria-controls", "school-listbox");
    }
    list.innerHTML = "";
    for (const [name, country, domain] of items) {
      const o = document.createElement("div"); o.setAttribute("role", "option");
      o.innerHTML = `<div class="name">${name}</div><div class="country">${country}</div><div class="domain">${domain}</div>`;
      o.addEventListener("click", () => { setVal(input, name); picked = name; close(); });
      list.appendChild(o);
    }
  };
  input.addEventListener("mousedown", () => (list ? close() : render([])));
  input.addEventListener("input", () => {
    picked = ""; clearTimeout(timer); render([]);
    timer = setTimeout(() => render(input.value ? all.filter((t) => t[0].toLowerCase().includes(input.value.toLowerCase())) : []), 500);
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  input.addEventListener("focusout", () => setTimeout(() => { close(); if (!picked) setVal(input, ""); }, 0));
})();
</script>

<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const fields = [...document.querySelectorAll("[data-field-path]")].map((e) => {
    const lab = e.querySelector("label").textContent.trim();
    const g = e.querySelector(".ashby-application-form-input-yesno");
    let v;
    if (g) v = [...g.querySelectorAll("button[aria-pressed=true]")].map((b) => b.textContent).join(",") || "-";
    else if (e.querySelector("input[type=radio], input[type=checkbox]")) v = [...e.querySelectorAll("input:checked")].map((i) => e.querySelector(`label[for="${i.id}"]`).textContent).join(", ") || "-";
    else v = JSON.stringify(e.querySelector("textarea, input").value);
    return lab.slice(0, 60) + " = " + v + " mark=" + (e.closest("[data-wdaf]")?.dataset.wdaf || e.querySelector("[data-wdaf]")?.dataset.wdaf || "-");
  });
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    "DRAFT " + JSON.stringify((window.__draft?.questions || []).map((q) => q.question)),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
