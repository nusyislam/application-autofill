<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Software Engineer @ Dodecal</title>
<style>
  body { font: 14px sans-serif; }
  .ashby-application-form-field-entry { margin: 10px 0; position: relative; }
  .ashby-application-form-input-yesno { display: flex; gap: 4px; position: relative; }
  .ashby-application-form-input-yesno-option[aria-pressed="true"] { background: #333; color: #fff; }
  /* Real Ashby: the mirror checkbox is NOT hidden (it has client rects). */
  ._input_1svni_78 { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .combo-list { position: absolute; background: #fff; border: 1px solid #999; width: 320px; z-index: 5; }
  .combo-list [role=option] { padding: 4px; }
</style>
<script>
// ---- stub chrome API (test only)
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: {
    firstName: "Test", lastName: "Applicant", preferredName: "Tess", email: "test@example.com", phone: "6465550100",
    phoneCountry: "United States of America", country: "United States of America", city: "Springfield", state: "New York",
    address1: "1 Test Street", zip: "10001",
    // applicationLocation not set here: the New York values set below (before the chrome stub) apply.
    linkedin: "https://www.linkedin.com/in/test/", github: "https://github.com/test", website: "https://test.dev",
    source: "LinkedIn", expectedGraduation: "05/21/2027",
    experiences: [{ company: "Examplecorp", title: "Engineering Intern" }],
    education: [{ school: "Lakeview University", schoolAliases: "LSU Lakeview University | Lakeland State University at Lakeview", schoolSearch: "Lakeview",
      degreeOptions: "Bachelor of Engineering | BEng | B.E. | BE\nBachelor's Degree | Bachelor's | Bachelors | Bachelor Degree\nBachelor of Science | BS | B.S. | BSc\nUndergraduate",
      field: "Computer Engineering", gpa: "", startYear: "2023", endYear: "2027" }],
    answers: { workAuth: "Yes", sponsorship: "No", over18: "Yes", previousEmployers: "Examplecorp", travel: "Maximum", restrictions: "None" },
    eeo: { gender: "Female", hispanic: "No", race: "Two or More Races", veteran: "Decline", disability: "Decline" },
    api: { key: "test-key", model: "stub" },
  },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with (settings a fixture
// sets itself are kept; a blank search took the old default search, and the default list when the list was blank too).
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension",
    onMessage: { addListener: (fn) => (onMsg = fn) },
    sendMessage: async (msg) => {
      if (msg.type === "DRAFT") {
        window.__draft = msg;
        return { model: "stub-draft-model", included: { linkedinChars: 0, resumeChars: 0, notesChars: 0, descriptionChars: (msg.job.description || "").length }, answers: msg.questions.map((q) => ({ id: q.id, answer: "I built a small tool that fills forms from a saved profile." + (q.asksForLink ? "\nhttps://github.com/test" : ""), project: "Form tool" })) };
      }
      if (msg.type === "ASK_AI") {
        window.__aiPayload = msg.questions;
        return { model: "stub-model", answers: msg.questions.map((q) => ({ id: q.id, answer: q.type === "textarea" ? "I enjoy building tools." : null, confidence: 0.9 })) };
      }
      return {};
    },
  },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<h1>Software Engineer</h1>
<!-- Dodecal-like Ashby page (fake data). "First and Last Name" got the last name (the last-name rule matched "Last Name"
     inside it); the question-form education fields were classified "education status" and left yellow; a rerun listed
     the kept checkgroup as unhandled and set the kept Yes / No again. -->
<div class="ashby-application-form-container">
<div class="ashby-application-form-section-container" id="sec">
  <div class="ashby-application-form-field-entry" data-field-path="n1"><label class="ashby-application-form-question-title _required_x" for="n1">First and Last Name</label><input class="ashby-application-form-input-text" id="n1" name="n1" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="n2"><label class="ashby-application-form-question-title _required_x" for="n2">First &amp; Last Name</label><input class="ashby-application-form-input-text" id="n2" name="n2" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="n3"><label class="ashby-application-form-question-title _required_x" for="n3">Full name (first and last)</label><input class="ashby-application-form-input-text" id="n3" name="n3" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="n4"><label class="ashby-application-form-question-title _required_x" for="n4">First Name</label><input class="ashby-application-form-input-text" id="n4" name="n4" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="n5"><label class="ashby-application-form-question-title _required_x" for="n5">Last Name</label><input class="ashby-application-form-input-text" id="n5" name="n5" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="n6"><label class="ashby-application-form-question-title" for="n6">Emergency Contact Name</label><input class="ashby-application-form-input-text" id="n6" name="n6" type="text"></div>
  <div class="ashby-application-form-field-entry" data-field-path="n7"><label class="ashby-application-form-question-title" for="n7">Last name of the employee who referred you</label><input class="ashby-application-form-input-text" id="n7" name="n7" type="text"></div>
  <div class="ashby-application-form-field-entry" data-field-path="e1"><fieldset class="ashby-application-form-input-radio-group"><label class="ashby-application-form-question-title _required_x" for="e1">What degree are you pursuing?</label>
    <div><input type="radio" id="e1_0" name="e1" value="0"><label for="e1_0">Associate's Degree</label></div>
    <div><input type="radio" id="e1_1" name="e1" value="1"><label for="e1_1">Bachelor's Degree</label></div>
    <div><input type="radio" id="e1_2" name="e1" value="2"><label for="e1_2">Master's Degree</label></div>
    <div><input type="radio" id="e1_3" name="e1" value="3"><label for="e1_3">PhD</label></div></fieldset></div>
  <div class="ashby-application-form-field-entry" data-field-path="e2"><fieldset class="ashby-application-form-input-radio-group"><label class="ashby-application-form-question-title _required_x" for="e2">What is your graduation date?</label>
    <div><input type="radio" id="e2_0" name="e2" value="0"><label for="e2_0">Fall 2026 (September-December)</label></div>
    <div><input type="radio" id="e2_1" name="e2" value="1"><label for="e2_1">Spring 2027 (January-May)</label></div>
    <div><input type="radio" id="e2_2" name="e2" value="2"><label for="e2_2">Summer 2027 (June or later)</label></div>
    <div><input type="radio" id="e2_3" name="e2" value="3"><label for="e2_3">Later than Summer 2027</label></div></fieldset></div>
  <div class="ashby-application-form-field-entry" data-field-path="e3"><label class="ashby-application-form-question-title _required_x" for="e3">What is your GPA?</label><input class="ashby-application-form-input-text" id="e3" name="e3" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="h1"><fieldset class="ashby-application-form-input-checkbox-group"><label class="ashby-application-form-question-title _required_x" for="h1">How did you hear about us?</label>
    <div><input type="checkbox" id="h1_0" name="LinkedIn"><label for="h1_0">LinkedIn</label></div>
    <div><input type="checkbox" id="h1_1" name="Indeed"><label for="h1_1">Indeed</label></div>
    <div><input type="checkbox" id="h1_2" name="Company website"><label for="h1_2">Company website</label></div>
    <div><input type="checkbox" id="h1_3" name="Friend"><label for="h1_3">Friend</label></div></fieldset></div>
  <div class="ashby-application-form-field-entry" data-field-path="h2"><fieldset class="ashby-application-form-input-checkbox-group"><label class="ashby-application-form-question-title _required_x" for="h2">Which programming languages do you use regularly?</label>
    <div><input type="checkbox" id="h2_0" name="Python" checked><label for="h2_0">Python</label></div>
    <div><input type="checkbox" id="h2_1" name="Go"><label for="h2_1">Go</label></div>
    <div><input type="checkbox" id="h2_2" name="Rust"><label for="h2_2">Rust</label></div>
    <div><input type="checkbox" id="h2_3" name="TypeScript"><label for="h2_3">TypeScript</label></div></fieldset></div>
  <div class="ashby-application-form-field-entry" data-field-path="y1"><label class="ashby-application-form-question-title _required_x" for="y1">Are you legally authorized to work in the United States?</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" class="_input_1svni_78" tabindex="-1" name="y1"></div></div>
</div>
</div>
<button id="submit" type="submit">Submit Application</button>
<pre id="out"></pre>
<script>
document.querySelectorAll(".ashby-application-form-input-yesno").forEach((g) =>
  g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    g.querySelector("input[type=checkbox]").checked = b.dataset.option === "yes";
  })));
</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  const report = () => {
    const fields = [...document.querySelectorAll("[data-field-path]")].map((e) => {
      const lab = e.querySelector("label").textContent.trim();
      const g = e.querySelector(".ashby-application-form-input-yesno");
      let v;
      if (g) v = ([...g.querySelectorAll("button[aria-pressed=true]")].map((x) => x.textContent).join(",") || "-") + ", mirror " + g.querySelector("input").checked;
      else if (e.querySelector("input[type=radio]")) { const ck = e.querySelector("input[type=radio]:checked"); v = JSON.stringify(ck ? e.querySelector('label[for="' + ck.id + '"]').textContent : ""); }
      else if (e.querySelector("input[type=checkbox]")) v = JSON.stringify([...e.querySelectorAll("input[type=checkbox]:checked")].map((x) => x.name).join(", "));
      else v = JSON.stringify(e.querySelector("input").value);
      return lab.slice(0, 60) + " = " + v + " mark=" + (e.closest("[data-wdaf]")?.dataset.wdaf || e.querySelector("[data-wdaf]")?.dataset.wdaf || "-");
    });
    return [...window.__errors.map((e) => "ERR " + e), ...window.__logs.map((l) => "LOG " + l), ...fields.map((f) => "FIELD " + f)];
  };
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const first = ["STATS " + JSON.stringify(stats), "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)), ...report()];
  window.__logs = []; window.__errors = []; window.__aiPayload = null;
  let stats2;
  try { stats2 = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const second = ["STATS " + JSON.stringify(stats2), ...report()].map((l) => "rerun: " + l);
  document.getElementById("out").textContent = "@@BEGIN\n" + [...first, ...second].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
