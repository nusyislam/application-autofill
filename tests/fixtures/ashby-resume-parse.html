<script>

// Yes / No: a click sets aria-pressed (the button's own state) and the mirror checkbox (the stored answer).
document.querySelectorAll(".ashby-application-form-input-yesno").forEach((g) =>

    g.querySelectorAll("button").forEach((x) => { x.setAttribute("aria-pressed", String(x === b)); x.classList.toggle("_active_1svni_57", x === b); });
    g.querySelector("input[type=checkbox]").checked = b.dataset.option === "yes";
  })));
const resume = document.getElementById("_systemfield_resume");
resume.addEventListener("change", () => {
  const box = resume.parentElement;
  box.querySelector(".ashby-application-form-input-file-dropzone").outerHTML =
    `<div class="_file_10xk4_76 ashby-application-form-input-file-item"><p class="_name_10xk4_41 ashby-application-form-input-file-item-name"><span>${resume.files[0]?.name || ""}</span></p></div>`;
  // The parse: prefills at 3 s; a late step at 6 s resets the first Yes / No's stored answer only.
  setTimeout(() => {
    setVal(document.getElementById("_systemfield_name"), "Test Applicant");
    setVal(document.getElementById("_systemfield_email"), "test@example.com");

  setTimeout(() => {
    document.querySelector('[name="6bd32fc4-e7af-4757-8e0b-8383f33eb53b"]').checked = false;
    window.__lateReset = true;
  }, 6000);
});

<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }

  await new Promise((r) => setTimeout(r, 12000));
  const fields = [...document.querySelectorAll(".ashby-application-form-input-yesno")].map((g) => {
    const lab = g.closest("[data-field-path]").querySelector("label").textContent.trim();

  });
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "PARSED " + !!window.__parsed + ", LATE RESET " + !!window.__lateReset,
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields.map((f) => "FIELD " + f),

}, 500);
