<script>

window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {

  },

  learned: [{ q: "Email (Please do not use an .edu email address)", a: "test@example.com", type: "text", company: "steadfast", pending: true, updated: 1793500000000 }],
  resumeFile: { name: "TestApplicantResume.pdf", type: "application/pdf", dataUrl: "data:application/pdf;base64,JVBERi0xLjQK" },
};

{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();

window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: {
    id: "test-extension",
    onMessage: { addListener: (fn) => (onMsg = fn) },
    sendMessage: async (msg) => {
      if (msg.type === "DRAFT") {
        window.__draft = msg;
        return { model: "stub-draft-model", included: { linkedinChars: 0, resumeChars: 0, notesChars: 0, descriptionChars: 0 }, answers: msg.questions.map((q) => ({ id: q.id, answer: "A draft." })) };
      }
      // The classifier as the real run's cache answered: Degree and Major are "education status".
      if (msg.type === "CLASSIFY_ASK") {
        window.__classify = (window.__classify || []).concat(msg.questions.map((q) => q.question));

        return { model: "stub-model", answers: msg.questions.map((q) => ({ id: q.id, answer: ans(q), confidence: ans(q) ? 0.9 : 0 })) };
      }
      return {};
    },
  },
};

<script>
// ---- iCIMS dropdown widget stand-in (behaviour assumed: click the a.dropdown-select to open; rows load by
// "ajax"; typing in .dropdown-search filters server-side; clicking a row selects it, updates the hidden
// select + the shown text, closes, and fires change). Markup copied from the real page's template.
// Steadfast's real Degree and Major lists (tests/fixtures/icims-edu-markup-raw.html); the school list trimmed (the real
// one is very long and searched server-side: "Lakeview" finds the full name).
const LISTS = {
  "-1_CandProfileFields.School": ["2nd Military Medical University","A. C. Patil College of Engineering","Aalto University","Aarhus University","Abilene Christian University","Academy College","Albany College of Pharmacy","Baruch College","Binghamton University","Columbia University","Cornell University","Fordham University","Hofstra University","New York University","Other College/High School","Pace University","Rutgers University","State University of New York at Albany","State University of New York at Buffalo","Lakeland State University at Lakeview","Stony Point College","LSU Maritime College","Syracuse University","University of Rochester","Yale University"],
  "-1_CandProfileFields.Degree": ["AS", "BA", "BCS", "BS", "HS Diploma/GED", "MBA", "MCS", "MS", "PhD"],
  "-1_CandProfileFields.Major": ["Aerospace Eng.", "Applied Mathematics", "Applied Physics", "Biochemistry", "Biomedical Eng.", "Business Admin.", "Chemical Eng.", "Chemistry", "Civil Eng.", "Communication Eng.", "Computer Eng.", "Computer Info. Sys.", "Computer Science", "Electrical Eng.", "Electronic Eng.", "English", "Finance/Accounting", "Industrial Eng.", "Information Sys.", "Management", "Management Info.Sys.", "Manufacturing Eng.", "Mathematics", "Mechanical Eng.", "Others"],
};
// The page's own handlers named in the onchange attributes.
window.pageDirtyFlag = false;
window.addItemToSelectFieldNLevelList = () => true;
const listFor = (id) => LISTS[id] || LISTS[id.replace(/^-\d+_PersonProfileFields\./, "")] || [];
const PH = '<span class="dropdown-placeholder">— Make a Selection —</span>';
function initWidget(sel) {
  const id = sel.id;
  const searchable = sel.getAttribute("icimsdropdown-search") === "1";
  const cur = sel.value ? sel.selectedOptions[0].text : "";
  sel.insertAdjacentHTML("afterend",
    `<a id="${id}_icimsDropdown" class="dropdown-select" aria-expanded="false" tabindex="0" role="combobox"><span id="${id}_fakeSelected_icimsDropdown" class="dropdown-text">${cur || PH}</span><div class="dropdown-arrow-container"><i class="dropdown-arrow"></i></div></a>` +
    `<div id="${id}_icimsDropdown_ctnr" class="dropdown-container dropdown-invisible" aria-owns="${id}_dropdown-results" aria-expanded="false"><input type="text" class="dropdown-search${searchable ? "" : " dropdown-invisible"}" autocomplete="off" placeholder="— Type to Search —" role="combobox"><div aria-live="polite"><ul id="${id}_dropdown-results" class="dropdown-results" role="listbox"></ul><div class="dropdown-loading hide"></div><div style="overflow: hidden; display: block; width:0;height:0;" role="status" id="result-summary_${id}"></div></div></div>`);
  const a = document.getElementById(id + "_icimsDropdown");
  const ctnr = document.getElementById(id + "_icimsDropdown_ctnr");
  const ul = document.getElementById(id + "_dropdown-results");
  const input = ctnr.querySelector("input");
  const load = ctnr.querySelector(".dropdown-loading");
  let timer;
  const render = (term) => {
    load.classList.remove("hide");
    clearTimeout(timer);
    timer = setTimeout(() => {
      const items = listFor(id).filter((t) => !term || t.toLowerCase().includes(term.toLowerCase())).slice(0, 25);
      ul.innerHTML = `<li class="dropdown-result result-selectable" role="option" dropdown-index="-1">${PH}</li>` + items.map((t, i) => `<li class="dropdown-result result-selectable" role="option" dropdown-index="${i}" title="${t}">${t}</li>`).join("");
      load.classList.add("hide");
    }, 200);
  };
  const open = () => { ctnr.classList.remove("dropdown-invisible"); a.setAttribute("aria-expanded", "true"); input.value = ""; render(""); };
  const close = () => { ctnr.classList.add("dropdown-invisible"); a.setAttribute("aria-expanded", "false"); };
  a.addEventListener("click", () => (ctnr.classList.contains("dropdown-invisible") ? open() : close()));
  input.addEventListener("input", () => render(input.value));
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  ul.addEventListener("click", (e) => {
    const li = e.target.closest("li.result-selectable");
    if (!li) return;
    const t = li.getAttribute("dropdown-index") === "-1" ? "" : li.textContent.trim();
    sel.innerHTML = '<option value="" legacy="true"></option>' + (t ? `<option value="${t}" selected>${t}</option>` : "");
    document.getElementById(id + "_fakeSelected_icimsDropdown").innerHTML = t || PH;
    close();
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  });
  document.addEventListener("click", (e) => { if (!a.contains(e.target) && !ctnr.contains(e.target)) close(); }, true);
}
document.querySelectorAll('select[icimsdropdown-enabled="1"]').forEach(initWidget);
// "Add More": the next group of the collection (ids -1 -> -2), its own Add link, the old one hidden.
window.__added = [];
window.showGroup = (name, from, to, n) => {
  window.__added.push(name);
  const old = document.querySelector(`.${CSS.escape(name)}${from}-Container`);
  const tmp = document.createElement("div");
  const k = String(-Number(from)), k2 = String(-Number(to));
  tmp.innerHTML = old.outerHTML
    .split(`${from}_`).join(`${to}_`).split(`${name}${from}`).join(`${name}${to}`).split(`(${k})`).join(`(${k2})`)
    .split(`data-index="${k}"`).join(`data-index="${k2}"`)
    .split(`'${from}', '${to}', ${n}`).join(`'${to}', '-${n + 1}', ${n + 1}`).split(`Button_${from}`).join(`Button_${to}`);
  const fresh = tmp.firstElementChild;
  fresh.querySelectorAll(".dropdown-select, .dropdown-container").forEach((x) => x.remove());
  fresh.querySelectorAll("input:not([type=hidden])").forEach((x) => (x.value = ""));
  fresh.querySelectorAll("select").forEach((s) => { if (s.getAttribute("icimsdropdown-enabled") === "1") s.innerHTML = '<option value="" legacy="true"></option>'; else s.selectedIndex = 0; });
  old.querySelector(".iCIMS_CollectionButtonsRow").style.display = "none";
  old.after(fresh);
  fresh.querySelectorAll('select[icimsdropdown-enabled="1"]').forEach(initWidget);
};
</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const val = (el) => {
    if (el.tagName !== "SELECT") return el.value;
    const shown = document.getElementById(el.id + "_fakeSelected_icimsDropdown");
    if (shown) return shown.querySelector(".dropdown-placeholder") ? "" : shown.textContent.trim();
    return el.selectedIndex > 0 || (el.value && el.value !== "0") ? el.selectedOptions[0].text : "";
  };
  // The securities rule with licenses listed (the page itself uses the default None).
  const secQs = ["Are you currently FINRA registered?", "Have you passed the Securities Industry Essentials (SIE) Exam?", "Do you currently hold any FINRA Series licenses (e.g., Series 7, 63, 66)?", "Please list any FINRA registrations or Series exams you hold"];
  const sec = ["SIE", "SIE, Series 7"].map((lic) => "SECURITIES " + lic + ": " + secQs.map((q, i) => {
    const r = AAF.profileValue({ label: q, nl: AAF.norm(q), nid: "", type: i === 3 ? "text" : "dropdown" }, { ...STORE.profile, answers: { ...STORE.profile.answers, securitiesLicenses: lic } });
    return typeof r === "symbol" ? "(left for you)" : JSON.stringify(r && r.value !== undefined ? r.value : r);
  }).join(" | "));
  const fields = [...document.querySelectorAll("#profileForm select, #profileForm input:not([type=hidden]):not([type=submit]):not(.dropdown-search), #profileForm textarea")]
    .filter((el) => el.offsetParent || el.getAttribute("icimsdropdown-enabled") === "1" || el.type === "file")
    .map((el) => (el.id || el.name).slice(0, 48) + " = " + JSON.stringify(val(el)) + " mark=" + (el.closest("[data-wdaf]")?.dataset.wdaf || "-"));
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "GUARD " + JSON.stringify([["submit", AAF.click(document.getElementById("cp_form_submit_i"))]]),
    "ADDED " + JSON.stringify(window.__added),
    "CLASSIFIED " + JSON.stringify(window.__classify || []),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question.slice(0, 70) + (q.options ? " " + JSON.stringify(q.options.slice(0, 6)) : ""))),
    "DRAFT " + JSON.stringify(window.__draft ? window.__draft.questions.map((q) => q.question.slice(0, 70)) : null),
    "LEARNED " + JSON.stringify(STORE.learned.map((x) => x.q + " = " + x.a + (x.pending ? " [pending]" : ""))),
    ...sec,
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
