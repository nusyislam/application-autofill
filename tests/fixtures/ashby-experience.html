<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Software Engineer @ Lunex</title>
<style>
  body { font: 14px sans-serif; }
  .ashby-application-form-field-entry { margin: 10px 0; position: relative; }
  .ashby-application-form-input-yesno { display: flex; gap: 4px; position: relative; }
  .ashby-application-form-input-yesno-option[aria-pressed="true"] { background: #333; color: #fff; }
  ._input_1svni_78 { position: absolute; opacity: 0; width: 1px; height: 1px; }
</style>
<script>
// ---- stub chrome API (test only)
window.__logs = [];
window.__errors = [];
const origLog = console.log;
console.log = (...a) => {
  if (a[0] === "[autofill]") window.__logs.push(a.slice(1).map((x) => (typeof x === "string" ? x : x && x.nodeType ? "<" + x.tagName + ">" : JSON.stringify(x))).join(" "));
  origLog(...a);
};
window.addEventListener("error", (e) => window.__errors.push("error: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rejection: " + (e.reason && e.reason.stack || e.reason)));
const STORE = {
  profile: {
    firstName: "Test", lastName: "Applicant", preferredName: "Tess", email: "test@example.com", phone: "6465550100",
    phoneCountry: "United States of America", country: "United States of America", city: "Springfield", state: "New York",
    address1: "1 Test Street", zip: "10001",
    linkedin: "https://www.linkedin.com/in/test/", github: "https://github.com/test", website: "https://test.dev",
    source: "LinkedIn", expectedGraduation: "05/2027",
    experiences: [{ company: "Examplecorp", title: "Engineering Intern" }],
    education: [{ school: "Lakeview University", field: "Computer Engineering", startYear: "2023", endYear: "2027" }],
    answers: { workAuth: "Yes", sponsorship: "No", over18: "Yes", previousEmployers: "Examplecorp", travel: "Maximum", restrictions: "None" },
    eeo: { gender: "Male", hispanic: "No", race: "Native Hawaiian or Other Pacific Islander", veteran: "Decline", disability: "Decline" },
    // Fake materials: Python is in the resume, Databricks in the LinkedIn text, Kubernetes only as the team's work.
    resumeText: "Test Applicant. Engineering Intern, Examplecorp: Built a data pipeline in Python that cleans sensor logs. The team deployed the service on Kubernetes.",
    linkedinText: "Capstone: Ran PySpark jobs on Databricks to train a small forecasting model.",
    extraNotes: "ACCURACY NOTES: teammates owned the Kubernetes deployment at Examplecorp, not me.",
    skills: "Python, SQL, Git",
    api: { key: "test-key", model: "stub" },
  },
  settings: { useAI: true, learn: true, threshold: 0.75 },
  learned: [],
};
let onMsg = null;
// Location settings have no default in Options: the New York values these tests were written with (settings a fixture
// sets itself are kept; a blank search took the old default search, and the default list when the list was blank too).
{ const P = STORE.profile, AL = (P.applicationLocation ||= {}), A = (P.answers ||= {}), blank = !String(AL.search || "").trim();
  if (blank) AL.search = "New York";
  if (blank && !String(AL.matches || "").trim()) AL.matches = "New York City, New York, United States | New York, New York, United States | New York, NY, United States | New York, NY | New York City | New York, NY, USA | New York, USA";
  if (!String(A.officeMetro || "").trim()) A.officeMetro = "New York City | NYC | New York, NY | New York, New York | Manhattan | Brooklyn | Queens | Bronx | Staten Island | Long Island | Jersey City | Hoboken | Newark | Westchester | Stamford"; }
window.chrome = {
  storage: {
    local: {
      get: async (keys) => {
        const ks = typeof keys === "string" ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys || {});
        const out = {};
        for (const k of ks) if (STORE[k] !== undefined) out[k] = JSON.parse(JSON.stringify(STORE[k]));
        return out;
      },
      set: async (o) => Object.assign(STORE, o),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: { id: "test-extension",
    onMessage: { addListener: (fn) => (onMsg = fn) },
    sendMessage: async (msg) => {
      // Stands in for Haiku, answering the way EXPERIENCE_SYSTEM asks, plus two bad replies the content side must
      // reject: a Yes whose quote isn't in the resume (Rust) and a "No" (Go).
      if (msg.type === "EXPERIENCE_CHECK") {
        window.__exp = msg.questions.map((q) => q.question);
        const r = (q) => /python/i.test(q) ? { answer: "Yes", source: "resume", quote: "Built a data pipeline in Python" }
          : /databricks/i.test(q) ? { answer: "Yes", source: "linkedin", quote: "Ran PySpark jobs on Databricks" }
          : /kubernetes/i.test(q) ? { answer: null, reason: "The materials credit the Kubernetes deployment to teammates." }
          : /rust/i.test(q) ? { answer: "Yes", source: "resume", quote: "Wrote a Rust CLI for log parsing" }
          : /\bgo\b/i.test(q) ? { answer: "No", source: null, quote: null }
          : { answer: null, reason: "Not in the materials." };
        return { model: "stub-haiku", answers: msg.questions.map((q) => ({ id: q.id, ...r(q.question) })) };
      }
      if (msg.type === "CLASSIFY_ASK") {
        window.__classify = msg.questions.map((q) => q.question);
        return { model: "stub-haiku", categories: msg.questions.map((q) => ({ id: q.id, category: "other" })) };
      }
      if (msg.type === "ASK_AI") {
        window.__aiPayload = msg.questions;
        return { model: "stub-haiku", answers: msg.questions.map((q) => ({ id: q.id, answer: "Yes", confidence: 0.9 })) };
      }
      return {};
    },
  },
};
window.__runFill = () => new Promise((res) => onMsg({ type: "FILL" }, {}, res));
</script>
</head>
<body>
<h1>Software Engineer</h1>
<!-- Yes / No experience questions go to a Haiku check that may only answer Yes, with a quote from the resume /
     LinkedIn / notes / skills that must really be there. Python (resume) and Databricks (LinkedIn) are Yes; export
     control, Kubernetes (teammates' work), a fabricated Rust quote and a "No" for Go stay yellow; years and a level
     scale stay yellow and never reach Haiku or the regular Claude batch. -->
<div class="ashby-application-form-container">
<div class="ashby-application-form-section-container" id="sec">
  <div class="ashby-application-form-field-entry" data-field-path="_systemfield_name"><label class="ashby-application-form-question-title _required_x" for="_systemfield_name">Name</label><input class="ashby-application-form-input-text" id="_systemfield_name" name="_systemfield_name" type="text" required></div>
  <div class="ashby-application-form-field-entry" data-field-path="lvl"><label class="ashby-application-form-question-title" for="lvl">Do you have experience with SQL?</label><select id="lvl" name="lvl"><option value="">Select...</option><option>None</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
  <div class="ashby-application-form-field-entry" data-field-path="yrs"><label class="ashby-application-form-question-title" for="yrs">How many years of experience do you have with Python?</label><input class="ashby-application-form-input-text" id="yrs" name="yrs" type="text"></div>
</div>
</div>
<button id="submit" type="submit">Submit Application</button>
<pre id="out"></pre>
<script>
const YN = [
  "Do you have experience with Python?",
  "Do you have experience with Databricks?",
  "Do you have experience with export control compliance?",
  "Do you have experience with Kubernetes?",
  "Do you have any experience with Rust?",
  "Do you have experience with Go?",
];
const sec = document.getElementById("sec");
YN.forEach((label, i) => {
  const id = "yn" + i;
  const e = document.createElement("div");
  e.className = "ashby-application-form-field-entry";
  e.dataset.fieldPath = id;
  e.innerHTML = `<label class="ashby-application-form-question-title" for="${id}">${label}</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" class="_input_1svni_78" tabindex="-1" name="${id}"></div>`;
  sec.appendChild(e);
});
document.querySelectorAll(".ashby-application-form-input-yesno").forEach((g) =>
  g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    g.querySelector("input[type=checkbox]").checked = b.dataset.option === "yes";
  })));
</script>
<!--SCRIPTS-->
<script>
setTimeout(async () => {
  let stats;
  try { stats = await window.__runFill(); } catch (e) { window.__errors.push("run: " + e.stack); }
  const fields = [...document.querySelectorAll("[data-field-path]")].map((e) => {
    const lab = e.querySelector("label").textContent.trim();
    const g = e.querySelector(".ashby-application-form-input-yesno");
    const c = e.querySelector("select, input");
    const v = g ? ([...g.querySelectorAll("button[aria-pressed=true]")].map((b) => b.textContent).join(",") || "-") : JSON.stringify(c.value);
    return lab.slice(0, 60) + " = " + v + " mark=" + (e.closest("[data-wdaf]")?.dataset.wdaf || e.querySelector("[data-wdaf]")?.dataset.wdaf || "-");
  });
  document.getElementById("out").textContent = "@@BEGIN\n" + [
    "STATS " + JSON.stringify(stats), "TOAST " + JSON.stringify((document.getElementById("aaf-done-toast")?.shadowRoot?.querySelector(".box")?.innerText || "").replace(/\n/g, " | ")),
    "EXPERIENCE_CHECK " + JSON.stringify(window.__exp || []),
    "CLASSIFY " + JSON.stringify(window.__classify || []),
    "AI " + JSON.stringify((window.__aiPayload || []).map((q) => q.question)),
    ...window.__errors.map((e) => "ERR " + e),
    ...window.__logs.map((l) => "LOG " + l),
    ...fields.map((f) => "FIELD " + f),
  ].join("\n") + "\n@@END";
}, 500);
</script>
</body>
</html>
