<!doctype html>
<html>
<head>

<title>Application Autofill promo tile</title>
<!-- Store screenshot source: the 440x280 small promo tile (tools/screenshots.ps1 shoots it at that size). -->
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f172a; color: #fff; position: relative; }

  .icon img { display: block; width: 72px; height: 72px; }
  h1 { position: absolute; left: 124px; top: 40px; margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.2px; }

  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }

  <div class="icon"><img src="../../icons/icon128.png" alt=""></div>
